<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password — Muse</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="forgot-title">
      <h1 id="forgot-title">Forgot your password?</h1>
      <p class="login-subtitle">Enter your username or email and we&rsquo;ll send you a reset link.</p>

      <form action="#" method="post">
        <div class="field">
          <label for="username">Username or email</label>
          <input type="text" id="username" name="username" autocomplete="username" required>
        </div>

        <button type="submit" name="reset">Send reset link</button>
      </form>

      <p class="login-help">
        <a href="login.html">Back to log in</a>
      </p>
    </section>
  </main>
</body>
</html>
